<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DanskGrammatik Hub Tester</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color-scheme: light; }
    body { margin: 0; background: #f4f6f8; color: #17212b; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 18px 60px; }
    h1 { margin: 0 0 6px; }
    .muted { color: #66727f; }
    .card { background: white; border: 1px solid #dfe5eb; border-radius: 14px; padding: 18px; margin-top: 16px; box-shadow: 0 4px 16px rgba(20, 32, 44, .05); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    label { display: block; font-weight: 650; margin-bottom: 6px; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #cbd4dc; border-radius: 9px; padding: 10px 12px; }
    textarea { min-height: 130px; resize: vertical; }
    button { border: 0; border-radius: 9px; padding: 10px 15px; cursor: pointer; background: #174f42; color: white; font-weight: 700; }
    button.secondary { background: #405363; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    pre { background: #101820; color: #d9f5e9; padding: 16px; border-radius: 10px; overflow: auto; min-height: 130px; white-space: pre-wrap; }
    .status { display: inline-block; border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 750; background: #e7edf2; }
    .ok { background: #dff5e8; color: #12633d; }
    .bad { background: #fde8e7; color: #9b2c26; }
  </style>
</head>
<body>
<main>
  <h1>DanskGrammatik Hub Tester</h1>
  <div class="muted">Test the deterministic lexical engine independently of the LLM scorer.</div>

  <section class="card">
    <div class="grid">
      <div>
        <label for="baseUrl">API URL</label>
        <input id="baseUrl" value="https://dommerai.onrender.com" />
      </div>
      <div>
        <label for="apiKey">X-API-Key</label>
        <input id="apiKey" type="password" placeholder="Enter API key" />
      </div>
    </div>
    <div class="actions">
      <button onclick="healthCheck()">Check Grammar Hub Health</button>
      <span id="healthBadge" class="status">Not checked</span>
    </div>
  </section>

  <section class="card">
    <label for="word">Word lookup</label>
    <input id="word" value="husene" />
    <div class="actions">
      <button onclick="lookupWord()">Lookup word</button>
      <button class="secondary" onclick="setWord('gik')">Try “gik”</button>
      <button class="secondary" onclick="setWord('børnene')">Try “børnene”</button>
      <button class="secondary" onclick="setWord('skolle')">Try unknown word</button>
    </div>
  </section>

  <section class="card">
    <label for="text">Text coverage analysis</label>
    <textarea id="text">Jeg modtog jakken i mandags, men da jeg åbnede pakken, så jeg, at den var ødelagt.</textarea>
    <div class="actions">
      <button onclick="analyzeText()">Analyze text</button>
    </div>
  </section>

  <section class="card">
    <strong>Response</strong>
    <pre id="output">Ready.</pre>
  </section>
</main>
<script>
  const $ = id => document.getElementById(id);
  const headers = () => ({
    "X-API-Key": $("apiKey").value,
    "Content-Type": "application/json"
  });
  const base = () => $("baseUrl").value.replace(/\/$/, "");

  async function request(path, options = {}) {
    $("output").textContent = "Loading...";
    const started = performance.now();
    try {
      const response = await fetch(base() + path, {
        ...options,
        headers: { ...headers(), ...(options.headers || {}) }
      });
      const body = await response.json().catch(() => ({ detail: "Non-JSON response" }));
      $("output").textContent = JSON.stringify({
        http_status: response.status,
        elapsed_ms: Math.round(performance.now() - started),
        response: body
      }, null, 2);
      return { response, body };
    } catch (error) {
      $("output").textContent = JSON.stringify({ error: String(error) }, null, 2);
      throw error;
    }
  }

  async function healthCheck() {
    const badge = $("healthBadge");
    badge.className = "status";
    badge.textContent = "Checking...";
    try {
      const { response, body } = await request("/grammar-hub/health");
      const ok = response.ok && body.status === "ok";
      badge.className = "status " + (ok ? "ok" : "bad");
      badge.textContent = ok ? `Healthy · ${body.latency_ms} ms` : "Unavailable";
    } catch {
      badge.className = "status bad";
      badge.textContent = "Request failed";
    }
  }

  function setWord(word) {
    $("word").value = word;
    lookupWord();
  }

  function lookupWord() {
    const word = encodeURIComponent($("word").value.trim());
    return request(`/lexicon/lookup?word=${word}`);
  }

  function analyzeText() {
    return request("/lexicon/analyze", {
      method: "POST",
      body: JSON.stringify({ text: $("text").value, unique_only: true })
    });
  }
</script>
</body>
</html>
